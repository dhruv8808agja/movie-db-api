basePath: /
definitions:
  auth.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        example: password
        type: string
      username:
        example: admin
        type: string
    type: object
  auth.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  models.Movie:
    properties:
      description:
        example: A computer hacker learns from mysterious rebels about the true nature
          of his reality
        type: string
      director:
        example: The Wachowskis
        type: string
      genres:
        description: stored as JSON
        example:
        - Action
        - Sci-Fi
        items:
          type: string
        type: array
      id:
        example: 1
        type: integer
      rating:
        example: 8.7
        maximum: 10
        minimum: 0
        type: number
      release_date:
        example: "1999-03-31T00:00:00Z"
        type: string
      title:
        example: The Matrix
        type: string
    type: object
  movies.DeleteMoviesRequest:
    properties:
      ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  movies.paginatedMoviesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Movie'
        type: array
      pagination:
        $ref: '#/definitions/movies.paginationMeta'
    type: object
  movies.paginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@moviedb.com
    name: API Support
  description: |-
    A movie database API with authentication, rate limiting, and caching
    This API allows you to manage movies with CRUD operations
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Movie Database API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password to receive a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Failed to generate token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: User login
      tags:
      - auth
  /movies:
    delete:
      consumes:
      - application/json
      description: Delete multiple movies in a single request. Requires authentication.
      parameters:
      - description: Array of movie IDs to delete
        in: body
        name: ids
        required: true
        schema:
          $ref: '#/definitions/movies.DeleteMoviesRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete multiple movies
      tags:
      - movies
    get:
      consumes:
      - application/json
      description: Get a paginated list of movies with optional search filters. Public
        endpoint (no authentication required).
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Filter by title (case-insensitive partial match)
        in: query
        name: title
        type: string
      - description: Filter by director (case-insensitive partial match)
        in: query
        name: director
        type: string
      - description: Filter by genre
        in: query
        name: genre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of movies with pagination info
          schema:
            $ref: '#/definitions/movies.paginatedMoviesResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List movies with filters
      tags:
      - movies
    post:
      consumes:
      - application/json
      description: Create a new movie with the provided details. Requires authentication.
      parameters:
      - description: Movie object to create
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/models.Movie'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created movie
          schema:
            $ref: '#/definitions/models.Movie'
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new movie
      tags:
      - movies
  /movies/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a movie by its ID. Requires authentication.
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete movie
      tags:
      - movies
    get:
      consumes:
      - application/json
      description: Get a single movie by its ID. Uses Redis caching. Requires authentication.
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Movie details
          schema:
            $ref: '#/definitions/models.Movie'
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get movie by ID
      tags:
      - movies
    put:
      consumes:
      - application/json
      description: Update an existing movie by ID. Requires authentication.
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated movie object
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/models.Movie'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated movie
          schema:
            $ref: '#/definitions/models.Movie'
        "400":
          description: Invalid ID or request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update movie
      tags:
      - movies
  /movies/bulk:
    post:
      consumes:
      - application/json
      description: Create multiple movies in a single request. Requires authentication.
      parameters:
      - description: Array of movie objects to create
        in: body
        name: movies
        required: true
        schema:
          items:
            $ref: '#/definitions/models.Movie'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created movies
          schema:
            items:
              $ref: '#/definitions/models.Movie'
            type: array
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create multiple movies
      tags:
      - movies
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
